name: Sugerir uma melhoria
description: Compartilhe uma situação em que a extensão poderia ajudar mais.
body:
  - type: textarea
    id: situation
    attributes:
      label: O que você quer conseguir?
      description: Conte como usa o sorteio e onde sentiu falta de alguma opção.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Sua ideia
      description: Descreva como a melhoria poderia funcionar, se já tiver uma ideia.
